<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="-apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>
  <rect width="880" height="520" fill="url(#bg)"/>

  <!-- card -->
  <rect x="240" y="80" width="400" height="360" rx="20" fill="#ffffff" stroke="#e6e6e6"/>
  <rect x="240" y="80" width="400" height="360" rx="20" fill="#ffffff" filter="url(#none)"/>

  <text x="440" y="150" text-anchor="middle" font-size="46">🔐</text>
  <text x="440" y="195" text-anchor="middle" font-size="24" font-weight="700" fill="#333">访问验证</text>
  <text x="440" y="222" text-anchor="middle" font-size="14" fill="#888">请输入管理员提供的访问密钥</text>

  <!-- input -->
  <rect x="280" y="252" width="320" height="48" rx="12" fill="#fafbfc" stroke="#e0e0e0"/>
  <text x="296" y="281" font-size="14" fill="#aaa" font-family="monospace">xxxxxxxx-xxxx-xxxx-…</text>

  <!-- button -->
  <rect x="280" y="320" width="320" height="48" rx="12" fill="url(#bg)"/>
  <text x="440" y="350" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">进入</text>

  <text x="440" y="412" text-anchor="middle" font-size="13" fill="#aaa">IPTV 源转 M3U 订阅工具</text>
</svg>
