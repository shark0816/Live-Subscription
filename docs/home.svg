<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" font-family="-apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="ph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>
  <rect width="880" height="600" fill="#f0f4f8"/>

  <!-- header -->
  <rect x="40" y="30" width="800" height="90" rx="16" fill="url(#ph)"/>
  <text x="70" y="72" fill="#fff" font-size="22" font-weight="700">IPTV 源转 M3U 订阅工具</text>
  <text x="70" y="98" fill="#fff" font-size="13" opacity="0.85">粘贴文本 / 上传文件 / 填源链接，一键生成可订阅 M3U</text>
  <rect x="700" y="55" width="110" height="36" rx="8" fill="#ffffff" opacity="0.2"/>
  <text x="755" y="78" fill="#fff" font-size="13" text-anchor="middle">📜 历史记录</text>

  <!-- card 1 -->
  <rect x="40" y="140" width="800" height="300" rx="16" fill="#ffffff" stroke="#eee"/>
  <text x="70" y="178" font-size="16" font-weight="600" fill="#555">⚙️ 转换输入</text>

  <text x="70" y="212" font-size="13" fill="#555">源链接（可选，留空则使用下方文本）</text>
  <rect x="70" y="224" width="740" height="40" rx="10" fill="#fafbfc" stroke="#e8ecf1"/>
  <text x="84" y="249" font-size="13" fill="#aaa" font-family="monospace">https://example.com/iptv.txt</text>

  <text x="70" y="290" font-size="13" fill="#555">频道文本（支持 频道名,URL / 裸链接 / 组名,#genre# 格式）</text>
  <rect x="70" y="302" width="740" height="80" rx="10" fill="#fafbfc" stroke="#e8ecf1"/>
  <text x="84" y="328" font-size="12" fill="#999" font-family="monospace">CCTV-1,http://1.2.3.4/live/1</text>
  <text x="84" y="348" font-size="12" fill="#999" font-family="monospace">央视,#genre#</text>
  <text x="84" y="368" font-size="12" fill="#999" font-family="monospace">CCTV-13,http://1.2.3.4/live/13</text>

  <rect x="70" y="398" width="360" height="30" rx="8" fill="#fafbfc" stroke="#e8ecf1"/>
  <text x="84" y="418" font-size="12" fill="#999">📎 上传文件（.txt / .m3u，≤4MB）</text>
  <rect x="450" y="398" width="360" height="30" rx="8" fill="#fafbfc" stroke="#e8ecf1"/>
  <text x="464" y="418" font-size="12" fill="#999">☑ 保存本次内容到历史记录</text>

  <rect x="70" y="440" width="740" height="44" rx="10" fill="url(#ph)"/>
  <text x="440" y="468" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">🚀 开始转换</text>

  <!-- card 2 -->
  <rect x="40" y="460" width="800" height="110" rx="16" fill="#ffffff" stroke="#eee"/>
  <text x="70" y="498" font-size="16" font-weight="600" fill="#555">🔗 我的持久订阅链接</text>
  <rect x="70" y="512" width="740" height="40" rx="10" fill="#f8f9fc" stroke="#eef1f5"/>
  <text x="84" y="537" font-size="12" fill="#667eea" font-family="monospace">https://xxx.workers.dev/subs?uuid=你的UUID</text>
</svg>
