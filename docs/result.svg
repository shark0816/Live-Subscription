<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" font-family="-apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="gh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00b894"/>
      <stop offset="100%" stop-color="#00a86b"/>
    </linearGradient>
  </defs>
  <rect width="880" height="600" fill="#f0f4f8"/>

  <!-- success header -->
  <rect x="40" y="30" width="800" height="90" rx="16" fill="url(#gh)"/>
  <text x="70" y="78" fill="#fff" font-size="26" font-weight="700">✅ 转换成功</text>
  <text x="70" y="102" fill="#fff" font-size="14" opacity="0.9">已生成标准 M3U，复制下方链接到播放器即可订阅</text>

  <!-- stats -->
  <rect x="40" y="140" width="800" height="110" rx="16" fill="#ffffff" stroke="#eee"/>
  <rect x="70" y="165" width="360" height="62" rx="10" fill="#f8f9fc"/>
  <text x="250" y="205" text-anchor="middle" font-size="28" font-weight="700" fill="#667eea">128</text>
  <text x="250" y="222" text-anchor="middle" font-size="12" fill="#888">频道数量</text>
  <rect x="450" y="165" width="360" height="62" rx="10" fill="#f8f9fc"/>
  <text x="630" y="205" text-anchor="middle" font-size="28" font-weight="700" fill="#667eea">320</text>
  <text x="630" y="222" text-anchor="middle" font-size="12" fill="#888">总行数</text>

  <!-- sub links -->
  <rect x="40" y="270" width="800" height="140" rx="16" fill="#ffffff" stroke="#eee"/>
  <text x="70" y="306" font-size="16" font-weight="600" fill="#555">🔗 订阅链接</text>
  <text x="70" y="334" font-size="12" fill="#888">持久订阅链接（推荐，转换后自动更新）</text>
  <rect x="70" y="344" width="740" height="38" rx="10" fill="#f8f9fc" stroke="#eef1f5"/>
  <text x="84" y="368" font-size="12" fill="#333" font-family="monospace">https://xxx.workers.dev/subs?uuid=你的UUID</text>
  <rect x="70" y="386" width="180" height="32" rx="10" fill="#667eea"/>
  <text x="160" y="407" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">复制持久链接</text>
  <rect x="270" y="386" width="170" height="32" rx="10" fill="#eef1f5"/>
  <text x="355" y="407" text-anchor="middle" font-size="13" font-weight="600" fill="#555">复制旧链接</text>

  <!-- preview -->
  <rect x="40" y="430" width="800" height="150" rx="16" fill="#ffffff" stroke="#eee"/>
  <text x="70" y="466" font-size="16" font-weight="600" fill="#555">👀 M3U 预览（前 30 行）</text>
  <rect x="70" y="480" width="740" height="86" rx="10" fill="#1e1e2e"/>
  <text x="84" y="502" font-size="11" fill="#d4d4d4" font-family="monospace">#EXTM3U</text>
  <text x="84" y="518" font-size="11" fill="#d4d4d4" font-family="monospace">#EXTINF:-1 tvg-logo="" tvg-name="CCTV-1" group-title="央视",CCTV-1</text>
  <text x="84" y="534" font-size="11" fill="#d4d4d4" font-family="monospace">http://1.2.3.4/live/1</text>
  <text x="84" y="550" font-size="11" fill="#d4d4d4" font-family="monospace">#EXTINF:-1 tvg-logo="" tvg-name="江苏卫视" group-title="江苏",江苏卫视</text>
</svg>
